    <script>
      (function() {
        var modal = document.getElementById('bb-auth-modal-wrap');
        var intro = document.getElementById('bb-intro');
        var video = document.getElementById('bb-intro-video');
        var videoToggle = document.getElementById('bb-video-toggle');
        var switchBtn = document.getElementById('bb-auth-switch');
        var switchLabel = document.getElementById('bb-auth-switch-label');
        var previousFocus, resumeVideo;
        var groupName = document.getElementById('bb-group-name');
        var inputName = document.getElementById('bb-input-name');
        var inputEmail = document.getElementById('bb-input-email');
        var inputPass = document.getElementById('bb-input-password');
        var reveal = document.getElementById('bb-show-pass');
        function showPassword(show) {
          inputPass.type = show ? 'text' : 'password';
          reveal.setAttribute('aria-pressed', String(show));
          reveal.setAttribute('aria-label', show ? 'Ocultar senha' : 'Mostrar senha');
        }
        reveal.addEventListener('click', function() { showPassword(inputPass.type === 'password'); });
        var title = document.getElementById('bb-auth-title');
        var desc = document.getElementById('bb-auth-desc');
        var submitBtn = document.getElementById('bb-auth-submit-btn');
        var errorEl = document.getElementById('bb-auth-error');
        var form = document.getElementById('bb-auth-form');

        var isRegister = false;

        function setMode(reg) {
          isRegister = reg;
          switchBtn.textContent = reg ? 'Entrar' : 'Cadastre-se grátis';
          switchLabel.textContent = reg ? 'Já tem conta?' : 'Ainda não tem conta?';
          inputPass.autocomplete = reg ? 'new-password' : 'current-password';
          inputPass.minLength = reg ? 6 : 0;
          inputPass.value = '';
          showPassword(false);
          inputEmail.value = '';
          inputEmail.type = reg ? 'tel' : 'text';
          inputEmail.autocomplete = reg ? 'tel-national' : 'username';
          inputEmail.placeholder = reg ? 'Telefone com DDD (ex: 11 99999-0000)' : 'Telefone com DDD ou e-mail';
          document.getElementById('bb-contact-label').textContent = reg ? 'Telefone com DDD' : 'Telefone ou e-mail';
          inputPass.placeholder = reg ? 'Senha (mín. 6 caracteres)' : 'Senha';
          groupName.style.display = reg ? 'flex' : 'none';
          if (reg) {
            inputName.setAttribute('required', 'required');
            title.textContent = 'Criar conta';
            desc.textContent = 'Leva menos de 1 minuto. Jogue e saque via PIX.';
            submitBtn.textContent = 'Criar conta grátis';
          } else {
            inputName.removeAttribute('required');
            title.textContent = 'Bem-vindo de volta';
            desc.textContent = 'Entre para continuar jogando e resgatando.';
            submitBtn.textContent = 'Entrar';
          }
          errorEl.style.display = 'none';
          errorEl.textContent = '';
        }

        switchBtn.addEventListener('click', function() {
          if (!submitBtn.disabled) setMode(!isRegister);
        });

        function openAuth(reg) {
          previousFocus = document.activeElement;
          setMode(reg);
          resumeVideo = !video.paused;
          video.pause();
          intro.inert = true;
          document.getElementById('root').inert = true;
          modal.style.display = 'flex';
          title.tabIndex = -1;
          title.focus();
        }

        function closeAuth() {
          if (submitBtn.disabled) return;
          modal.style.display = 'none';
          intro.inert = false;
          if (resumeVideo) startVideo();
          document.getElementById('root').inert = false;
          if (previousFocus && previousFocus !== document.body) previousFocus.focus();
          else if (window.bbEntry) document.getElementById('bb-play').focus();
        }

        document.getElementById('bb-close').addEventListener('click', closeAuth);
        modal.addEventListener('keydown', function(e) {
          if (e.key === 'Escape') closeAuth();
          if (e.key !== 'Tab') return;
          var controls = Array.from(modal.querySelectorAll('button, input')).filter(function(el) {
            return !el.disabled && el.getClientRects().length;
          });
          var first = controls[0], last = controls[controls.length - 1];
          if ((e.shiftKey && (document.activeElement === first || document.activeElement === title)) ||
              (!e.shiftKey && document.activeElement === last)) {
            e.preventDefault();
            (e.shiftKey ? last : first).focus();
          }
        });

        function goToGame() {
          var target = location.pathname.startsWith('/bubbleblast') ? '/bubbleblast/painel' : '/painel';
          location.assign(target + location.search);
        }

        function startVideo() {
          if (!video.src) video.src = 'images/video/vdlpf.mp4';
          video.play().catch(function() {});
        }
        videoToggle.addEventListener('click', function() {
          if (video.paused) startVideo();
          else video.pause();
        });
        video.addEventListener('play', function() { videoToggle.textContent = 'Pausar vídeo'; });
        video.addEventListener('pause', function() { videoToggle.textContent = 'Reproduzir vídeo'; });

        function showError(msg) {
          errorEl.textContent = msg;
          errorEl.style.display = 'block';
        }

        function getStoredToken() {
          return localStorage.getItem('bb_token') ||
                 localStorage.getItem('bb_session') ||
                 localStorage.getItem('pg_auth_token') ||
                 localStorage.getItem('token') || '';
        }

        if (window.bbEntry) {
          intro.hidden = false;
          document.body.classList.add('bb-entry-page');
          videoToggle.textContent = 'Reproduzir vídeo';
          if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) startVideo();
          document.getElementById('bb-enter').addEventListener('click', function() { openAuth(false); });
          document.getElementById('bb-signup').addEventListener('click', function() { openAuth(true); });
          var playBtn = document.getElementById('bb-play');
          playBtn.addEventListener('click', async function() {
            var token = getStoredToken();
            if (!token) return openAuth(false);

            try {
              var res = await fetch('/api/auth/me', {
                headers: { Authorization: 'Bearer ' + token, 'X-Game-Id': 'g_bubble_blast' },

              });
              if (res.ok && (await res.json()).user) return goToGame();

            } catch (_) {
              openAuth(false);
              showError('Não foi possível verificar a sessão. Tente novamente.');
            } finally {
              playBtn.disabled = false;
            }
          });
          if (/\/(login|cadastro)\/?$/.test(location.pathname)) {
            openAuth(/\/cadastro\/?$/.test(location.pathname));
          }
        }

        form.addEventListener('submit', function(e) {
          e.preventDefault();
          errorEl.style.display = 'none';
          var email = inputEmail.value.trim().toLowerCase();
          var pass = inputPass.value;

          if (!email || !pass) {
            showError('Informe seu telefone ou e-mail e sua senha.');
            return;
          }

          if (isRegister) {
            var name = inputName.value.trim();
            if (name.length < 2) {
              showError('Informe seu nome completo.');

            }
            if (pass.length < 6) {
              showError('A senha deve ter pelo menos 6 caracteres.');
              return;
            }
            var phone = email.replace(/[^0-9]/g, '');
            if (!/^(?:\+?55)?[0-9]{10,11}$/.test(email.replace(/[ ()-]/g, ''))) {
              showError('Informe um telefone válido com DDD.');
              return;
            }
            if (phone.length > 11) phone = phone.slice(2);

            var utmParams = {};
            ['utm_source', 'utm_medium', 'utm_campaign', 'utm_content', 'utm_term', 'src', 'sck'].forEach(function(k) {
              var v = localStorage.getItem('bb_' + k) || localStorage.getItem(k) || sessionStorage.getItem('bb_' + k) || sessionStorage.getItem(k);
              if (v) utmParams[k] = v;

              headers: {
                'Content-Type': 'application/json',
                'X-Game-Origin': 'g_bubble_blast',
                'X-Game-Id': 'g_bubble_blast',
                'X-Registered-Game': 'g_bubble_blast'
              },
              body: JSON.stringify(Object.assign({
                name: name,
                phone: phone,
                password: pass,
                refCode: ref,
                partner: partner,
                partnerCode: partner,
                game: 'g_bubble_blast',
                gameId: 'g_bubble_blast',
                registeredGame: 'g_bubble_blast',
                acquisitionGame: 'g_bubble_blast',
                trackingGame: 'g_bubble_blast',
                trackingSource: 'jogarbubble_domain'
              }, utmParams))
            }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
              .then(function(res) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Criar conta grátis';
                if (!res.ok) {
                  showError(res.data.error || res.data.message || 'Erro ao realizar cadastro.');
                  return;
                }
                if (res.data.token) {
                  localStorage.setItem('bb_token', res.data.token);
                  localStorage.setItem('bb_session', res.data.token);
                  localStorage.setItem('pg_auth_token', res.data.token);
                  localStorage.setItem('paygateway_token', res.data.token);
                  localStorage.setItem('token', res.data.token);
                }
                try {
                  if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ source: 'bubble-blast-shell', event: 'auth', token: res.data.token, user: res.data.user }, '*');
                  }
                } catch(_) {}
                goToGame();
              }).catch(function(err) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Criar conta grátis';
                showError('Erro de conexão ao cadastrar. Tente novamente.');
              });
          } else {
            submitBtn.disabled = true;
            submitBtn.textContent = 'Entrando...';

            fetch('/api/auth/login', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'X-Game-Origin': 'g_bubble_blast',
                'X-Game-Id': 'g_bubble_blast'
              },
              body: JSON.stringify({
                login: email.includes('@') ? email : email.replace(/[^0-9]/g, '').replace(/^55(?=[0-9]{10,11}$)/, ''),
                password: pass,
                game: 'g_bubble_blast',

              })
            }).then(function(r) { return r.json().then(function(d) { return { ok: r.ok, data: d }; }); })
              .then(function(res) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar';
                if (!res.ok) {
                  showError(res.data.error || res.data.message || 'E-mail ou senha incorretos.');
                  return;
                }
                if (res.data.token) {
                  localStorage.setItem('bb_token', res.data.token);
                  localStorage.setItem('bb_session', res.data.token);
                  localStorage.setItem('pg_auth_token', res.data.token);
                  localStorage.setItem('paygateway_token', res.data.token);
                  localStorage.setItem('token', res.data.token);
                }
                try {
                  if (window.parent && window.parent !== window) {
                    window.parent.postMessage({ source: 'bubble-blast-shell', event: 'auth', token: res.data.token, user: res.data.user }, '*');
                  }
                } catch(_) {}
                goToGame();
              }).catch(function(err) {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Entrar';
                showError('Erro de conexão ao entrar. Tente novamente.');
              });
          }
        });

        // Intercept clicks on landing page CTA buttons to open Auth
        document.addEventListener('click', function(e) {
          var target = e.target.closest('button, a');
          if (!target || intro.contains(target) || modal.contains(target)) return;
          var text = (target.textContent || '').trim().toLowerCase();
          if (text.includes('jogar') || text.includes('conta') || text.includes('entrar') || text.includes('cadastr')) {
            var token = getStoredToken();
            if (!token) {
              e.preventDefault();
              e.stopPropagation();
              openAuth(text.includes('cadastr') || text.includes('grátis') || text.includes('gratis'));
            }
          }
        }, true);


      })();
    </script>
  

</body></html>
