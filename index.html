    <script>
      (() => {
        const query=new URLSearchParams(location.search);
        const route=[query.get('site')||'',query.get('game')||'',location.pathname,location.hostname].join(' ').toLowerCase();
        const match=route.match(/count.?masters|block.?win|block.?puzzle|bubble|zumbla|subway|raspa|gen.?dino|gendino|dinopay|dinoplay|dinipay/);
        if(!match)return;
        document.title='Carregando jogo';
        document.querySelectorAll('script[type="application/ld+json"],link[rel="manifest"],link[rel="icon"],link[rel="apple-touch-icon"]').forEach(el=>el.remove());
        document.querySelectorAll('meta[content]').forEach(el=>{if(/inex/i.test(el.content))el.content='Jogos';});
      })();
